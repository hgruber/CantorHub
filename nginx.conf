worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format simple
      '$request '
      '$status '
      '$body_bytes_sent Bytes';

    access_log /dev/stdout simple;
    error_log  /dev/stderr warn;
    include /etc/nginx/mime.types;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Host fuer Django: der Header samt Port, wie der Browser ihn schickt ($host
    # liesse den Port fallen — bei "-p 8000:8000" baute Django dann Adressen
    # ohne Port, und die Origin-Pruefung des CSRF-Schutzes schlug fehl). Fehlt
    # der Header (etwa ein Health-Check), bleibt es beim bisherigen $host.
    map $http_host $django_host {
        ""      $host;
        default $http_host;
    }

    proxy_cache_path /data/tiles levels=1:2 keys_zone=tiles:10m max_size=512m inactive=7d use_temp_path=off;

    server {
        listen 8000;
        server_name localhost;
        client_max_body_size 512M;
        # Vor nginx steht ein haproxy, der TLS terminiert und die echte Client-IP
        # an X-Forwarded-For anhaengt. Ohne realip waere $remote_addr die
        # Proxy-Adresse und Django saehe fuer jeden Besucher dieselbe IP — die
        # Drosseln in auth.py/auftritte.py wirkten global statt pro Client und
        # Auftrittsabo.bestaetigt_ip protokollierte den Proxy.
        set_real_ip_from 10.88.0.0/16;
        real_ip_header X-Forwarded-For;
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # Media nur für eingeloggte Nutzer: jede Anfrage wird per Subrequest
        # gegen die Django-Session geprüft.
        location /media/ {
            auth_request /media-auth;
            alias /data/media/;
            # Ohne Cache-Header fragt der Browser jedes Bild bei jedem
            # Seitenaufruf neu an — und jede dieser Anfragen laeuft ueber
            # auth_request durch Django. Der Inhalt unter einem Pfad aendert
            # sich nicht: Ueberschreiben legt einen neuen Blob an und zieht die
            # Verweise um (docs/files.md, „File versions"). "private", damit
            # kein gemeinsamer Zwischenspeicher Mitgliederdateien vorhaelt.
            add_header Cache-Control "private, max-age=604800" always;
        }
        location = /media-auth {
            internal;
            proxy_pass http://127.0.0.1:8001/intern/media-auth/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $django_host;
        }
        # Ziel für X-Accel-Redirect aus der Token-Route /intern/datei/…
        location /protected-media/ {
            internal;
            alias /data/media/;
        }
        # OSM-Kacheln werden serverseitig gecacht (7 Tage) — Browser-IP bleibt intern.
        location /tiles/ {
            proxy_pass https://tile.openstreetmap.org/;
            proxy_set_header Host "tile.openstreetmap.org";
            proxy_set_header User-Agent "CantorHub/1.0 (self-hosted member portal)";
            proxy_ssl_server_name on;

            proxy_cache tiles;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            expires 7d;
            add_header Cache-Control "public";
        }
        # Der iCal-Secret steht im Pfad — nicht in die Logs schreiben.
        location /intern/calendar/ {
            access_log off;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $django_host;
            # $remote_addr statt $proxy_add_x_forwarded_for: realip (oben) hat
            # daraus bereits die echte Client-IP gemacht, und die Kette bleibt
            # eindeutig — _client_ip() in auth.py nimmt den letzten Eintrag.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Setzt in dieser Kette niemand — ein leerer Wert loescht den Header,
            # sonst reichte nginx den vom Client frei erfundenen weiter.
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
        }
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $django_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Setzt in dieser Kette niemand — ein leerer Wert loescht den Header,
            # sonst reichte nginx den vom Client frei erfundenen weiter.
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
        }
    }
}