worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format simple
      '$request '
      '$status '
      '$body_bytes_sent Bytes';

    access_log /dev/stdout simple;
    error_log  /dev/stderr warn;
    include /etc/nginx/mime.types;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    server {
        listen 8000;
        server_name localhost;
        client_max_body_size 512M;
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # Media nur für eingeloggte Nutzer: jede Anfrage wird per Subrequest
        # gegen die Django-Session geprüft.
        location /media/ {
            auth_request /media-auth;
            alias /app/media/;
        }
        location = /media-auth {
            internal;
            proxy_pass http://127.0.0.1:8001/intern/media-auth/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }
        # Ziel für X-Accel-Redirect aus der Token-Route /intern/datei/…
        location /protected-media/ {
            internal;
            alias /app/media/;
        }
        # Der iCal-Secret steht im Pfad — nicht in die Logs schreiben.
        location /intern/calendar/ {
            access_log off;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        }
    }
}