# /etc/nginx/conf.d/django_static.conf
server {
    listen 8000;
    server_name localhost;
    client_max_body_size 50M;

    location /static/ {
        alias /app/static/;
    }
    location /media/ {
        alias /app/media/;
    }
    location / {
        proxy_pass http://127.0.0.1:8001; # Redirect all other requests
    }
}
