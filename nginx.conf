worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format simple
      '$request '
      '$status '
      '$body_bytes_sent Bytes';

    access_log /dev/stdout simple;
    error_log  /dev/stderr warn;
    include /etc/nginx/mime.types;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server {
        listen 8000;
        server_name localhost;
        client_max_body_size 50M;
        location /static/ {
	        alias /app/static/;
	    }
        location /media/ {
	        alias /app/media/;
        }
	    location / {
	        proxy_pass http://127.0.0.1:8001; # Redirect all other requests
        }
    }
}
