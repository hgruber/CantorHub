{% extends 'base.html' %}
{% load static %}
{% block content %}
{% if edit_text is not None %}
<form method="post">
  {% csrf_token %}
  <div class="wiki">
    <textarea name="text" wrap="soft" style="width:100%;min-height:400px">{{ edit_text }}</textarea>
  </div>
  <div style="margin-top:0.5em;display:flex;gap:0.5em;align-items:center">
    <input type="text" name="kommentar" placeholder="Kommentar (optional)" style="flex:1">
    <button type="submit">Speichern</button>
  </div>
</form>
{% else %}
<div class="wiki-page">
  {% if is_outdated %}
  <div class="outdated-banner">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span>Dies ist Version {{ artikel.version }}. Die aktuelle Version ist
      <a href="{% url 'article_view' name=artikel.name %}">Version {{ latest_version }}</a>.
    </span>
  </div>
  {% endif %}
  <div class="wiki">{{ text|safe }}</div>
</div>
{% endif %}
{% endblock %}
