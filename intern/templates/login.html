<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Just Gospel Frankfurt</title>
        <link rel="stylesheet" href="/static/css/login-style.css" />
        <link rel="icon" href="/static/images/JG-Frankfurt-G-color.svg" />
    </head>
    <body>
        <div class="login-container">
            <div class="login-card">
                <div class="logo">
                    <a href="/"
                        ><img
                            src="/static/images/JG-Frankfurt-test.svg"
                            style="width: 120px"
                    /></a>
                </div>

                <h1>Willkommen bei Just Gospel Frankfurt</h1>

                <div class="welcome-message">
                    <p>
                        Hallo, schön dass du da bist! Melde dich an, um auf
                        deine persönlichen Bereiche zuzugreifen.
                    </p>
                </div>

                <form
                    class="login-form"
                    method="post"
                    action="{% url 'login' %}"
                >
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Benutzername</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="password">Passwort</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        />
                    </div>

                    <button type="submit" class="login-button">Anmelden</button>
                </form>

                <div class="register-link">
                    <p>
                        Noch keinen Account?
                        <a href="#register">Hier registrieren</a>
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
