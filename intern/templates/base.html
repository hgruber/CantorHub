{% load static %}
<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Just Gospel Intern - {{ seitentitel }}</title>
        <link rel="stylesheet" href="/static/intern/css/intern.css" />
        <link
            rel="icon"
            href="/static/intern/images/JG-Frankfurt-wG-color.svg"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css"
            type="text/css"
        />
        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="{% static 'intern/js/htmx.min.js' %}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.js"></script>
        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <!-- Top‑Bar -->
        <header class="top-bar">
            <div class="hamburger" id="hamburger">☰</div>
            <h1 class="title">
                {{ seitentitel }} {% if edit %}
                <a href="{% url edit id %}" title="bearbeiten">📝</a>
                {% endif %} {% if delete %}
                <a href="{% url delete id %}" title="löschen">❌</a>
                {% endif %} {% if view %}
                <a href="{% url view id %}" title="ansehen">👀</a>
                {% endif %} {% if history %}
                <a
                    href="{% url history id %}"
                    title="Bearbeitungs-Historie ansehen"
                    >🕑</a
                >
                {% endif %}
            </h1>
            {% if up %}
            <div class="bearbeiten">
                <h1><a href="{% url up %}" title="Eine Ebene zurück">▲</a></h1>
            </div>
            {% endif %}
        </header>

        <div class="layout">
            <aside class="sidebar" id="sidebar">
                {% include "sidebar.html" %}
            </aside>

            <main class="content">{% block content %}{% endblock %}</main>
        </div>

        <script>
            // Hamburger‑Toggle
            const hamburger = document.getElementById("hamburger");
            const sidebar = document.getElementById("sidebar");

            hamburger.addEventListener("click", () => {
                sidebar.classList.toggle("active");
            });

            Dropzone.autoDiscover = false;
            document.addEventListener("DOMContentLoaded", function () {
                var myDropzone = new Dropzone("#InternDropzone", {
                    url: "/intern/upload/",
                    paramName: "file",
                    maxFilesize: 25000000,
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                    },
                    init: function () {
                        this.on("success", function (file, response) {
                            console.log(file);
                            console.log(response);
                            const textarea = document.getElementById(
                                "mitteilung-textarea",
                            );
                            if (textarea) {
                                textarea.value += response.url;
                            }
                        });
                        this.on("queuecomplete", function () {
                            console.log("Alle Uploads abgeschlossen!");
                            {% if reload %}
                            window.location.reload();
                            {% endif %}
                        });
                    },
                });
            });
            document.addEventListener("DOMContentLoaded", function () {
                const headerCheckbox = document.querySelector(".select-all");
                const rowCheckboxes = document.querySelectorAll(
                    "tbody input[type=checkbox]",
                );

                headerCheckbox?.addEventListener("change", function () {
                    rowCheckboxes.forEach((cb) => (cb.checked = this.checked));
                });
            });

            // Audio play/pause functionality
            document.addEventListener("DOMContentLoaded", function () {
                let currentAudio = null;
                let currentAudioElement = null;

                document.addEventListener("click", function (e) {
                    if (e.target.classList.contains("audio-button")) {
                        const button = e.target;
                        const audioUrl = button.getAttribute("data-audio-url");
                        const songId = button.getAttribute("data-song-id");

                        // If there's a currently playing audio and it's not the same song, stop it
                        if (currentAudio && currentAudio !== button) {
                            if (currentAudioElement) {
                                currentAudioElement.pause();
                                currentAudioElement = null;
                            }
                            currentAudio.classList.remove("playing");
                            currentAudio.textContent = "▶";
                            currentAudio = null;
                        }

                        // Create audio element if it doesn't exist or if it's a different song
                        if (!currentAudio || currentAudio !== button) {
                            // If there's an existing audio element, pause it
                            if (currentAudioElement) {
                                currentAudioElement.pause();
                            }

                            const audio = new Audio(audioUrl);
                            audio.play();
                            currentAudio = button;
                            currentAudioElement = audio;
                            button.classList.add("playing");
                            button.textContent = "⏸";

                            audio.addEventListener("ended", function () {
                                button.classList.remove("playing");
                                button.textContent = "▶";
                                currentAudio = null;
                                currentAudioElement = null;
                            });

                            audio.addEventListener("error", function () {
                                console.error("Error playing audio:", audioUrl);
                                button.classList.remove("playing");
                                button.textContent = "▶";
                                currentAudio = null;
                                currentAudioElement = null;
                            });
                        } else {
                            // Toggle play/pause for the same song
                            if (currentAudioElement.paused) {
                                currentAudioElement.play();
                                button.classList.add("playing");
                                button.textContent = "⏸";
                            } else {
                                currentAudioElement.pause();
                                button.classList.remove("playing");
                                button.textContent = "▶";
                                currentAudio = null;
                                currentAudioElement = null;
                            }
                        }
                    }
                });
            });
        </script>
    </body>
</html>
