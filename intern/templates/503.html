{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ vereinsname_kurz|default:"Portal" }} Intern – Wartung</title>
    <link rel="icon" href="{% static 'intern/brand/logo.svg' %}" />
    <link rel="stylesheet" href="{% static 'intern/css/intern.css' %}" />
    {% include "_theme_boot.html" %}
    {% include "_brand_boot.html" %}
</head>
<body>
<div class="error-standalone">
    <div class="error-card">
        <a href="/" class="error-brand">
            <img src="{% static 'intern/brand/logo.svg' %}" alt="{{ vereinsname_kurz|default:'Portal' }}" />
            <span>{{ vereinsname_kurz|default:"Portal" }}</span>
        </a>

        <div class="error-note">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <circle cx="32" cy="32" r="20" fill="var(--brand-light)" stroke="var(--brand)" stroke-width="3"/>
                <line x1="32" y1="18" x2="32" y2="32" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
                <line x1="32" y1="32" x2="42" y2="38" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
                <path d="M44 46l8 8" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
                <path d="M48 42a4 4 0 0 1 0 8 4 4 0 0 1 0-8z" fill="var(--brand-light)" stroke="var(--brand)" stroke-width="3"/>
            </svg>
        </div>

        <div class="error-code">503</div>

        <h1 class="error-title">Wartung</h1>
        <p class="error-message">
            Das Mitgliederportal wird gerade gewartet.<br>
            Bitte versuche es in Kürze erneut.
        </p>

        <div class="error-actions">
            <button type="button" class="error-btn-primary" onclick="location.reload()">Seite neu laden</button>
            <a href="/" class="error-btn-secondary">Zur Startseite</a>
        </div>
    </div>
</div>
</body>
</html>
