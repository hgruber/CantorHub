{% if not initial %}<input type="hidden"
       id="last_id_input"
       name="last_id"
       value="{{ last_id }}"
       hx-swap-oob="true" />{% endif %}
{% for message in messages %}
    {% include '_message.html' with message=message %}
    {% if trenner_nach and message.id == trenner_nach %}
        <div class="forum-neu-trenner" role="separator"><span>Neu seit Deinem letzten Besuch</span></div>
    {% endif %}
{% endfor %}
