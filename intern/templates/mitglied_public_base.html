{% load static startseite_tags %}
<!DOCTYPE html>
<html lang="de" class="join-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="meta-theme-color" content="#ffffff">
    <title>{% block title %}Mitglied werden – {{ vereinsname_lang }}{% endblock %}</title>
    <link rel="icon" href="{% startseite_datei 'logo.svg' %}" />
    <link rel="stylesheet" href="{% static 'intern/css/intern.css' %}" />
    {% include "_theme_boot.html" %}
    {% include "_brand_boot.html" %}
</head>
<body class="join-page">
    <div class="join-wrap{% block wrap_modifier %}{% endblock %}">
        <div class="join-card">
            <div class="join-header">
                <a href="/"><img class="join-logo" src="{% startseite_datei 'logo.svg' %}" alt="{{ vereinsname_lang }}" /></a>
                {% block header %}{% endblock %}
            </div>
            {% block body %}{% endblock %}
        </div>
    </div>
</body>
</html>
