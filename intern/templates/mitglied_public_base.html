{% load static %}
<!DOCTYPE html>
<html lang="de" class="join-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="meta-theme-color" content="#ffffff">
    <title>{% block title %}Mitglied werden – {{ vereinsname_lang }}{% endblock %}</title>
    <link rel="icon" href="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" />
    <link rel="stylesheet" href="{% static 'intern/css/intern.css' %}" />
    {# Dark-Mode vor dem ersten Paint setzen (FOUC vermeiden) – identisch zu base.html. #}
    <script>(function(){var t=localStorage.getItem("theme");if(!t&&window.matchMedia)t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";if(t==="dark")document.documentElement.setAttribute("data-theme","dark");var m=document.getElementById("meta-theme-color");if(m)m.setAttribute("content",t==="dark"?"#1a1a2e":"#ffffff")})()</script>
</head>
<body class="join-page">
    <div class="join-wrap{% block wrap_modifier %}{% endblock %}">
        <div class="join-card">
            <div class="join-header">
                <a href="/"><img class="join-logo" src="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" alt="{{ vereinsname_lang }}" /></a>
                {% block header %}{% endblock %}
            </div>
            {% block body %}{% endblock %}
        </div>
    </div>
</body>
</html>
