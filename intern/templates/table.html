{% extends 'base.html' %} {% load django_tables2 %} {% block content %}
<div class="action offcanvas" id="Action">
    Kopieren<br />Verschieben<br />Löschen
</div>
{% if filter %}
<div class="selector offcanvas" id="ColumnSelector">
    <form method="post">
        <button type="submit" class="btn btn-primary">Spalten auswählen</button
        ><br />
        {% csrf_token %} {% for col in column_choices %}
        <label>
            <input
                type="checkbox"
                name="columns"
                value="{{ col.name }}"
                {% if col.checked %}checked{% endif %}
            />
            {{ col.label }} </label
        ><br />
        {% endfor %}
    </form>
</div>
<div class="filter offcanvas" id="Filter">
    <form method="get">
        <div>
            <button type="submit" class="btn btn-primary">Filtern</button>
            <a href="?" class="btn btn-secondary"> Zurücksetzen </a>
        </div>
        {{ filter.form.as_div }}
        <div style="height: 30px"></div>
    </form>
</div>
{% endif %} {% render_table table %} {% endblock %}
