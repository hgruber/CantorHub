{% load static %}

<!-- Brand -->
<div class="sidebar-brand">
    <img src="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" alt="Just Gospel" class="sidebar-logo" />
    <span class="sidebar-title">Just Gospel</span>
</div>

<!-- Navigation -->
<nav class="sidebar-nav">
    <a href="/intern/artikel/Aktuell/" class="nav-item" data-path="/intern/artikel/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
            <path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>
        </svg>
        <span>Aktuell</span>
    </a>

    <a href="/intern/forum/" class="nav-item" data-path="/intern/forum/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Forum</span>
    </a>

    <a href="/intern/termin/" class="nav-item" data-path="/intern/termin/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Termine</span>
    </a>

    <a href="/intern/titel/" class="nav-item" data-path="/intern/titel/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <span>Repertoire</span>
    </a>

    <a href="/intern/mitglied/" class="nav-item" data-path="/intern/mitglied/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Mitglieder</span>
    </a>

    <a href="/intern/ordner/0/" class="nav-item" data-path="/intern/ordner/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Dateien</span>
    </a>

    {% if user.is_superuser %}
    <div class="nav-divider"></div>

    <a href="/admin/" class="nav-item" data-path="/admin/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M22 12a10 10 0 0 1-10 10M12 2a10 10 0 0 1 10 10"/>
            <path d="M2 12a10 10 0 0 0 2.93 7.07"/>
        </svg>
        <span>Admin</span>
    </a>
    {% endif %}
</nav>

<!-- Footer -->
<div class="sidebar-bottom">
    <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit" class="nav-item" style="font-size:13px">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Abmelden</span>
        </button>
    </form>
    <div class="version-string">{{ VERSION }}</div>
</div>

<!-- File upload -->
<div class="file-container">
    <form action="/intern/upload/" method="post" class="dropzone" id="InternDropzone">
        {% csrf_token %}
        {% if folder_id %}<input type="hidden" name="folder_id" value="{{ folder_id }}" />{% endif %}
        <div class="dz-message" data-dz-message><span>Dateien ablegen</span></div>
    </form>
</div>
