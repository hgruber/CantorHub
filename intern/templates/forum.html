{% extends 'base.html' %} {% load static %} {% block content %}
<div class="forum-entry">
    <form
        id="send-form"
        method="post"
        hx-post="{% url 'send' forum=forum %}?last_id={{ last_id|default:0 }}"
        hx-target="#messages"
        hx-swap="afterbegin"
        hx-on="htmx:afterRequest: this.reset()"
    >
        {% csrf_token %}
        <textarea
            name="mitteilung"
            placeholder="Schreibe Deine Nachricht.."
            required
        ></textarea>
        <button type="submit"></button>
    </form>
</div>
<div
    id="messages"
    class="messages"
    hx-get="{% url 'poll' forum=forum %}?last_id={{ last_id|default:0 }}"
    hx-trigger="every 5s"
    hx-swap="afterbegin"
>
    {% include '_messages.html' with messages=messages %}
</div>

{% endblock %}
