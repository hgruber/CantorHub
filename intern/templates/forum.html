{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="forum-entry">
        <div class="text-container">
            <form id="send-form"
                  method="post"
                  hx-post="{% url 'forum_send' forum=forum %}"
                  hx-target="#messages"
                  hx-swap="afterbegin"
                  hx-on::after-request="this.reset(); return true;">
                {% csrf_token %}
                <textarea id="mitteilung-textarea"
                          name="mitteilung"
                          placeholder="Schreibe Deine Nachricht.."
                          required></textarea>
                <input type="hidden"
                       id="last_id_input"
                       name="last_id"
                       value="{{ last_id|default:0 }}"
                       hx-swap-oob="true" />
                <button type="submit"></button>
            </form>
        </div>
    </div>
    <div id="messages"
         class="messages"
         hx-get="{% url 'forum_get' forum=forum %}"
         hx-include="#last_id_input"
         hx-trigger="every 5s"
         hx-swap="afterbegin">
        {% include '_messages.html' with messages=messages %}
        <div id="load-more"
             class="sentinel"
             style="height: 1px;
                    background: transparent"
             hx-get="{% url 'forum_more' forum=forum %}?oldest_id={{ oldest_id }}"
             hx-target="#messages"
             hx-swap="beforeend"
             hx-trigger="intersect once"
             hx-swap-oob="false"></div>
    {% endblock %}
</div>
