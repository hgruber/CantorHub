{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just Gospel Intern – Seite nicht gefunden</title>
    <link rel="icon" href="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" />
    <link rel="stylesheet" href="{% static 'intern/css/intern.css' %}" />
    <script>(function(){var t=localStorage.getItem("theme");if(!t&&window.matchMedia)t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";if(t==="dark")document.documentElement.setAttribute("data-theme","dark")})()</script>
</head>
<body>
<div class="error-standalone">
    <div class="error-card">
        <a href="/" class="error-brand">
            <img src="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" alt="Just Gospel" />
            <span>Just Gospel</span>
        </a>

        <div class="error-note">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <path d="M24 44V20l28-6v24" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="16" cy="44" r="8" fill="var(--brand-light)" stroke="var(--brand)" stroke-width="3"/>
                <circle cx="44" cy="38" r="8" fill="var(--brand-light)" stroke="var(--brand)" stroke-width="3"/>
                <line x1="24" y1="20" x2="52" y2="14" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="error-code">404</div>

        <h1 class="error-title">Seite nicht gefunden</h1>
        <p class="error-message">
            Diese Seite existiert nicht oder wurde verschoben.<br>
            Vielleicht hilft ein Blick in den internen Bereich weiter.
        </p>

        <div class="error-actions">
            <a href="/intern/artikel/Aktuell/" class="error-btn-primary">Zum internen Bereich</a>
            <button type="button" class="error-btn-secondary" onclick="history.back()">Zurück</button>
        </div>

        <p class="error-path">{{ request.path }}</p>
    </div>
</div>
</body>
</html>
