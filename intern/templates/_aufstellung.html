{% if value %}{% with a=value %}
<div class="aufst{% if gross %} aufst-gross{% endif %}" role="img" aria-label="{{ a.label }}">
  <div class="aufst-buehne">
    <span class="aufst-block aufst-links">{% for k in a.hinten.0 %}<i class="aufst-p aufst-{{ k.status }}{% if k.ich %} aufst-ich{% endif %}" title="{{ k.titel }}"></i>{% endfor %}</span>
    <span class="aufst-block aufst-rechts">{% for k in a.hinten.1 %}<i class="aufst-p aufst-{{ k.status }}{% if k.ich %} aufst-ich{% endif %}" title="{{ k.titel }}"></i>{% endfor %}</span>
    {% if a.extra %}<span class="aufst-block aufst-extra">{% for k in a.extra %}<i class="aufst-p aufst-{{ k.status }}{% if k.ich %} aufst-ich{% endif %}" title="{{ k.titel }}"></i>{% endfor %}</span>{% endif %}
    <span class="aufst-block aufst-links">{% for k in a.vorn.0 %}<i class="aufst-p aufst-{{ k.status }}{% if k.ich %} aufst-ich{% endif %}" title="{{ k.titel }}"></i>{% endfor %}</span>
    <span class="aufst-block aufst-rechts">{% for k in a.vorn.1 %}<i class="aufst-p aufst-{{ k.status }}{% if k.ich %} aufst-ich{% endif %}" title="{{ k.titel }}"></i>{% endfor %}</span>
  </div>
</div>
{% endwith %}{% endif %}
