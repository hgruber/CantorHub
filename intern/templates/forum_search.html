{% extends 'base.html' %}
{% block topbar_icon %}<svg class="topbar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>{% endblock %}
{% block content %}
<div class="forum-search">
    {% for message in messages %}
    <div class="forum-search-row">
        <a class="forum-search-forum" href="{% url 'forum_view' forum=message.forum_id %}"
           title="{{ message.forum.thema }}">{{ message.forum.thema }}</a>
        <div class="forum-search-msg">
            {% include '_message.html' with message=message highlight_query=search_query %}
        </div>
    </div>
    {% empty %}
    <div class="forum-search-empty">Keine Nachrichten gefunden.</div>
    {% endfor %}
</div>
{% endblock %}
