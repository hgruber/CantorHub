{% load ui_tags %}
{% comment %}
    Info-Icon mit Erklärungs-Tooltip. Der Text kommt aus dem help_text des
    Model-Felds; tooltip.js zeigt ihn bei Hover, Fokus und Tap.
    type="button" ist zwingend – das Icon steht in Formularen.
{% endcomment %}
<button type="button" class="hilfe-icon" data-hilfe="{{ text }}" aria-label="Erklärung: {{ label }}">{% symbol "hilfe" width="14" height="14" aria_hidden="true" %}</button>
