{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ vereinsname_kurz|default:"Portal" }} Intern – Serverfehler</title>
    <link rel="icon" href="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" />
    <link rel="stylesheet" href="{% static 'intern/css/intern.css' %}" />
    <script>(function(){var t=localStorage.getItem("theme");if(!t&&window.matchMedia)t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";if(t==="dark")document.documentElement.setAttribute("data-theme","dark")})()</script>
</head>
<body>
<div class="error-standalone">
    <div class="error-card">
        <a href="/" class="error-brand">
            <img src="{% static 'intern/images/JG-Frankfurt-wG-color.svg' %}" alt="{{ vereinsname_kurz|default:'Portal' }}" />
            <span>{{ vereinsname_kurz|default:"Portal" }}</span>
        </a>

        <div class="error-note">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <path d="M32 10a22 22 0 1 1 0 44 22 22 0 0 1 0-44z" fill="var(--brand-light)" stroke="var(--brand)" stroke-width="3"/>
                <path d="M32 10a22 22 0 0 1 15.6 6.4" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
                <path d="M26 14l4 10h-6l12 16" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M24 52l4-12" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
            </svg>
        </div>

        <div class="error-code">500</div>

        <h1 class="error-title">Interner Serverfehler</h1>
        <p class="error-message">
            Etwas ist schiefgelaufen. Wir wurden benachrichtigt und kümmern uns darum.<br>
            Bitte versuche es später noch einmal.
        </p>

        <div class="error-actions">
            <a href="/intern/artikel/Aktuell/" class="error-btn-primary">Zur Startseite</a>
            <button type="button" class="error-btn-secondary" onclick="location.reload()">Seite neu laden</button>
        </div>
    </div>
</div>
</body>
</html>
