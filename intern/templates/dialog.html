<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="manifest" href="/static/intern/manifest.json">
        <meta name="theme-color" content="#c14468">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style"
              content="black-translucent">
        <title>
            {% block title %}{% endblock %}
        </title>
        <link rel="stylesheet" href="/static/intern/css/login-style.css" />
        <link rel="icon" href="/static/intern/images/JG-Frankfurt-wG-color.svg" />
    </head>
    <body>
        <div class="login-container">
            <div class="login-card">
                <div class="logo">
                    <a href="/">
                        <img src="/static/intern/images/JG-Frankfurt-wG-color.svg"
                             style="width: 96px" />
                    </a>
                </div>
                {% block content %}{% endblock %}
            </div>
        </div>
    </body>
</html>
