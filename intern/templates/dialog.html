{% load static startseite_tags %}
<!DOCTYPE html>
<html lang="de" class="join-page">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="manifest" href="{% url 'manifest' %}">
        <meta name="theme-color" id="meta-theme-color" content="#ffffff">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <title>
            {% block title %}{% endblock %}
        </title>
        <link rel="stylesheet" href="{% static 'intern/css/intern.css' %}" />
        {% include "_theme_boot.html" %}
        {% include "_brand_boot.html" %}
        <link rel="stylesheet" href="{% static 'intern/css/login-style.css' %}" />
        <link rel="icon" href="{% startseite_datei 'logo.svg' %}" />
    </head>
    <body class="join-page">
        <div class="join-wrap">
            <div class="join-card">
                <div class="join-header">
                    <a href="/">
                        <img class="join-logo" src="{% startseite_datei 'logo.svg' %}"
                             alt="{{ vereinsname_lang }}" />
                    </a>
                </div>
                {% block content %}{% endblock %}
            </div>
        </div>
        {% block extra_js %}{% endblock %}
    </body>
</html>
