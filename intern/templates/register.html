{% extends "dialog.html" %}
{% block title %}Passwort zurücksetzen{% endblock %}
{% block content %}
    <h1>Passwort zurücksetzen</h1>
    <div class="welcome-message">Meist genügt es, nur den Benutzernamen einzugeben.</div>
    <form method="POST" class="form-group">
        {% csrf_token %} {{ form.as_div }}
        <br />
        <div class="form-group">
            <button type="submit" class="login-button">zurücksetzen</button>
        </div>
    </form>
{% endblock %}
