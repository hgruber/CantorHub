<div
    class="{% if message.sender == user %}message_me{% else %}message{% endif %}"
    data-id="{{ message.id }}"
>
    <div class="avatar">
        {% if message.sender != user %}
        <img
            src="{{ message.sender.avatar.url }}"
            alt="{{ message.sender.first_name }} {{ message.sender.last_name }} "
        />
        <div>{{ message.sender.first_name }}</div>
        {% endif %}
    </div>
    <div
        class="{% if message.sender == user %}content_me{% else %}content{% endif %}"
    >
        <p>{{ message.formatiert|safe|linebreaksbr }}</p>
        <time>{{ message.datum|date:"d.M Y H:i" }}</time>
    </div>
</div>
