{% load search_highlight %}
{% with hq=highlight_query|default:"" %}
<div class="{% if message.sender == user %}message_me{% else %}message{% endif %}"
     data-id="{{ message.id }}">
    <div class="avatar"
         {% if message.sender and not message.sender.ist_namensverweis and not message.is_from_bot %}onclick="window.location.href='/intern/mitglied/{{ message.sender.id }}/'"{% endif %}>
        {% if message.sender != user %}
            <img src="{{ message.sender_avatar_url }}"
                 alt="{{ message.sender_name }}" width="38" height="38" loading="lazy" />
            <div>{{ message.sender_name }}</div>
        {% endif %}
    </div>
    <div class="{% if message.sender == user %}content_me{% else %}content{% endif %}">
        {{ message.formatiert|highlight:hq }}
        <time>{{ message.datum|date:"d.M Y H:i" }}</time>
        <div class="reactions" data-message-id="{{ message.id }}"></div>
    </div>
    <button type="button" class="reaction-add" data-message-id="{{ message.id }}"
            title="Reaktion hinzufügen" aria-label="Reaktion hinzufügen">+</button>
</div>
{% endwith %}
