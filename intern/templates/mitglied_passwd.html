{% extends "base.html" %}
{% load static %}
{% block title %}{{ seitentitel }}{% endblock %}
{% block extra_js %}
    <script src="{% static '/intern/js/zxcvbn.js' %}"></script>
{% endblock %}
{% block content %}
    <div class="wiki">
        {% if messages %}
            {% for message in messages %}<div class="error" role="alert">{{ message }}</div>{% endfor %}
        {% endif %}
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group">
                    <label for="new_password1" class="form-label">Neues Passwort</label>
                    <input type="password"
                           class="form-control password-field"
                           id="new_password1"
                           name="new_password1"
                           required>
                </div>
                <div class="form-group">
                    <label for="new_password2" class="form-label">bestätigen</label>
                    <input type="password"
                           class="form-control"
                           id="new_password2"
                           name="new_password2"
                           required>
                </div>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Passwort ändern</button>
                <a href="{% url 'mitglied_view' user.id %}" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </div>
{% endblock %}
