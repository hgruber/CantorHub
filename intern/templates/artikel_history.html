{% extends 'base.html' %}
{% block topbar_icon %}<svg class="topbar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>{% endblock %}
{% block content %}
<div class="history-view">
    <form method="get" action="{% url 'article_diff' name=name %}" id="history-form">
        <div class="history-toolbar">
            <button type="submit" class="btn btn-primary">Versionen vergleichen</button>
        </div>
        <div class="history-table-wrap" id="history-wrap">
        <table class="history-table">
            <thead>
                <tr>
                    <th title="Neuere Version">neu</th>
                    <th title="Ältere Version">alt</th>
                    <th>Version</th>
                    <th>Datum</th>
                    <th>Autor</th>
                    <th>Kommentar</th>
                    <th>Änderungen</th>
                </tr>
            </thead>
            <tbody id="history-tbody">
                {% include "_artikel_history_rows.html" with rows=rows name=name total=total offset=offset %}
            </tbody>
        </table>
        {% if has_more %}
        <div id="history-sentinel" class="table-sentinel" data-next-offset="{{ next_offset }}"></div>
        {% endif %}
        </div>
    </form>
</div>

<script>
(function () {
    // Keep v1 (older) always below v2 (newer) — enforce MediaWiki-style radio logic.
    // Re-queries rows each time so dynamically appended rows are included.
    const form = document.getElementById("history-form");

    function getRows() { return form.querySelectorAll("tbody tr"); }

    function indexOfChecked(radioName, allRows) {
        let i = 0;
        for (const row of allRows) {
            if (row.querySelector('input[name="' + radioName + '"]')?.checked) return i;
            i++;
        }
        return -1;
    }

    form.addEventListener("change", function (e) {
        const radio = e.target;
        if (radio.type !== "radio") return;
        const allRows = getRows();
        const changedIdx = [...allRows].indexOf(radio.closest("tr"));
        if (radio.name === "v2") {
            const v1idx = indexOfChecked("v1", allRows);
            if (v1idx <= changedIdx) {
                const nextRow = allRows[changedIdx + 1];
                if (nextRow) nextRow.querySelector('input[name="v1"]').checked = true;
            }
        } else {
            const v2idx = indexOfChecked("v2", allRows);
            if (v2idx >= changedIdx) {
                const prevRow = allRows[changedIdx - 1];
                if (prevRow) prevRow.querySelector('input[name="v2"]').checked = true;
            }
        }
    });

    // Infinite scroll
    var sentinel = document.getElementById("history-sentinel");
    if (!sentinel) return;
    var tbody = document.getElementById("history-tbody");
    var loading = false;
    var done = false;

    function loadMore() {
        if (loading || done) return;
        var offset = parseInt(sentinel.dataset.nextOffset, 10);
        loading = true;
        sentinel.classList.add("loading");
        fetch(window.location.pathname + "?offset=" + offset, {
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
            tbody.insertAdjacentHTML("beforeend", data.html);
            if (data.has_more) {
                sentinel.dataset.nextOffset = data.next_offset;
            } else {
                done = true;
                observer.disconnect();
                sentinel.remove();
            }
        })
        .catch(function (e) { console.error("history scroll error:", e); })
        .finally(function () {
            loading = false;
            if (!done) sentinel.classList.remove("loading");
        });
    }

    var wrap = document.getElementById("history-wrap");
    var observer = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) loadMore();
    }, { root: wrap, rootMargin: "200px" });
    observer.observe(sentinel);
})();
</script>
{% endblock %}
