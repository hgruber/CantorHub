{% extends "emails/base.html" %}
{# Rundmail an Mitglieder: Body aus MAIL_RUNDMAIL, darunter die Unterschrift. #}

{% block after_body %}
{% if signature_group_name %}
<tr>
  <td style="background-color:#ffffff;padding:0 32px 28px;">
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:0 0 20px;">
    <p style="margin:0 0 6px;font-size:13px;font-weight:700;color:{{ brand_farbe }};letter-spacing:.01em;">{{ signature_group_name }}</p>
    {% for name in signature_members %}
    <p style="margin:0;font-size:13px;color:#374151;line-height:1.6;">{{ name }}</p>
    {% endfor %}
  </td>
</tr>
{% endif %}
{% endblock %}
