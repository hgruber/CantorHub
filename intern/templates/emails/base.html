<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{{ mail_title|default:vereinsname }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:{{ mail_farbe_bg }};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:{{ mail_farbe_bg }};padding:32px 16px;">
    <tr>
      <td align="center">

        <!-- Card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:520px;border-radius:6px;overflow:hidden;
                      box-shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.03);">

          <!-- Header -->
          <tr>
            <td style="background-color:{{ brand_farbe }};padding:24px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:14px;vertical-align:middle;">
                    <img src="cid:logo" width="48" height="48" alt=""
                         style="display:block;border:0;border-radius:4px;">
                  </td>
                  <td style="vertical-align:middle;">
                    <span style="color:{{ mail_farbe_onbrand }};font-size:18px;font-weight:700;
                                 letter-spacing:.01em;line-height:1.2;">
                      {{ vereinsname }}
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:{{ mail_farbe_card }};padding:32px;">
              {% block body %}{{ body_html|safe }}{% endblock %}
            </td>
          </tr>

          {% block after_body %}{% endblock %}

          <!-- Footer -->
          {% if mail_footer %}
          <tr>
            <td style="background-color:{{ mail_farbe_bg }};padding:20px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <img src="cid:logo" width="24" height="24" alt=""
                         style="display:block;border:0;border-radius:2px;">
                  </td>
                  <td style="vertical-align:middle;">
                    <span style="color:{{ mail_farbe_muted }};font-size:12px;line-height:1.5;">{{ mail_footer }}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          {% endif %}

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>
  <!-- /Outer wrapper -->

</body>
</html>
