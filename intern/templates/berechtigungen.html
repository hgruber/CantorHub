{% extends 'base.html' %}
{% block topbar_icon %}
    <svg class="topbar-icon"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        <circle cx="12" cy="16" r="1" fill="currentColor" stroke="none" />
    </svg>
{% endblock %}
{% block content %}
    <style>
/* ─── Permission Matrix ────────────────────────────────── */
.perm-matrix-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--bg-card);
}
.perm-matrix {
    border-collapse: collapse;
    white-space: nowrap;
    width: 100%;
}

/* Sticky user column */
.perm-user-col {
    min-width: 230px;
    position: sticky;
    left: 0;
    background: linear-gradient(var(--stimme-tint, transparent), var(--stimme-tint, transparent)), var(--bg-card);
    z-index: 3;
    border-right: 1px solid var(--border-strong);
}
.perm-corner {
    top: 0;
    z-index: 5 !important;
    background: var(--bg-thead);
}
.perm-col-head {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg-thead);
    width: 36px;
    min-width: 36px;
    max-width: 36px;
    height: 140px;
    vertical-align: middle;
    text-align: left;
    border-bottom: 2px solid var(--border-strong);
    border-left: 1px solid var(--border);
    padding: 0;
}
.perm-col-head:first-of-type { border-left: none; }
.perm-col-head.perm-col-admin {
    border-left: 2px solid var(--border-strong);
}
.perm-col-rotate {
    position: relative;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.perm-col-rotate span {
    display: block;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
    color: var(--t2);
    line-height: 1;
}
.perm-col-head.perm-col-admin .perm-col-rotate span {
    color: #d97706;
}
[data-theme="dark"] .perm-col-head.perm-col-admin .perm-col-rotate span {
    color: #fbbf24;
}

/* Table body rows */
.perm-matrix tbody tr:first-child td {
    border-top: 2px solid black;
}
.perm-row td {
    border-bottom: 1px solid var(--border);
}
.perm-row:last-child td { border-bottom: none; }
.perm-row-group-last td { border-bottom-color: var(--border-strong); }

.perm-user-name {
    padding: 8px 12px;
    vertical-align: middle;
}
.perm-user-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
}
.perm-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--t1);
    white-space: nowrap;
}

/* Voice badges */
.badge-stimme-s { background: rgba(124, 58, 237, 0.12); color: #7c3aed; }
.badge-stimme-a { background: rgba(193, 68, 104, 0.12); color: #c14468; }
.badge-stimme-t { background: rgba(3, 105, 161, 0.12);  color: #0369a1; }
.badge-stimme-b { background: rgba(5, 150, 105, 0.12);  color: #059669; }
.badge-stimme-c { background: rgba(180, 83, 9, 0.12);   color: #b45309; }
.badge-stimme-m { background: rgba(8, 145, 178, 0.12);  color: #0891b2; }
.badge-stimme-n { background: var(--bg-row-hover);       color: var(--t4); }

/* Stimme tint for user column */
.perm-stimme-s { --stimme-tint: rgba(124,  58, 237, 0.07); }
.perm-stimme-a { --stimme-tint: rgba(193,  68, 104, 0.07); }
.perm-stimme-t { --stimme-tint: rgba(  3, 105, 161, 0.07); }
.perm-stimme-b { --stimme-tint: rgba(  5, 150, 105, 0.07); }
.perm-stimme-c { --stimme-tint: rgba(180,  83,   9, 0.07); }
.perm-stimme-m { --stimme-tint: rgba(  8, 145, 178, 0.07); }

[data-theme="dark"] .perm-stimme-s { --stimme-tint: rgba(167, 139, 250, 0.10); }
[data-theme="dark"] .perm-stimme-a { --stimme-tint: rgba(240, 128, 154, 0.10); }
[data-theme="dark"] .perm-stimme-t { --stimme-tint: rgba( 56, 189, 248, 0.10); }
[data-theme="dark"] .perm-stimme-b { --stimme-tint: rgba( 52, 211, 153, 0.10); }
[data-theme="dark"] .perm-stimme-c { --stimme-tint: rgba(251, 191,  36, 0.10); }
[data-theme="dark"] .perm-stimme-m { --stimme-tint: rgba( 34, 211, 238, 0.10); }

/* Permission cell */
.perm-cell-td {
    text-align: center;
    padding: 6px 4px;
    vertical-align: middle;
    border-left: 1px solid var(--border);
}
.perm-cell-td:first-of-type { border-left: none; }
.perm-cell-td.perm-col-admin {
    border-left: 2px solid var(--border-strong);
}

.perm-cell {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border-dark);
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background var(--ease), border-color var(--ease), transform 0.1s ease;
    padding: 0;
    vertical-align: middle;
}
.perm-cell:hover {
    border-color: var(--brand);
    background: var(--brand-light);
    transform: scale(1.1);
}
.perm-cell.granted {
    background: var(--brand);
    border-color: var(--brand);
}
.perm-cell.granted:hover {
    background: var(--brand-dark);
    border-color: var(--brand-dark);
    transform: scale(1.1);
}
.perm-cell.pending::after {
    content: '';
    position: absolute;
    top: -2px;
    right: -2px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #f59e0b;
    border: 1px solid var(--bg-card);
}

/* Admin cell — gold variant */
.perm-cell-admin {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border-dark);
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background var(--ease), border-color var(--ease), transform 0.1s ease;
    padding: 0;
    vertical-align: middle;
}
.perm-cell-admin:hover {
    border-color: #d97706;
    background: rgba(217, 119, 6, 0.12);
    transform: scale(1.1);
}
.perm-cell-admin.granted {
    background: #d97706;
    border-color: #d97706;
}
.perm-cell-admin.granted:hover {
    background: #b45309;
    border-color: #b45309;
    transform: scale(1.1);
}
.perm-cell-admin.pending::after {
    content: '';
    position: absolute;
    top: -2px;
    right: -2px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #f59e0b;
    border: 1px solid var(--bg-card);
}

[data-theme="dark"] .perm-cell { border-color: rgba(255,255,255,0.15); }
[data-theme="dark"] .perm-cell:hover { background: var(--brand-light); border-color: var(--brand); }
[data-theme="dark"] .perm-cell-admin { border-color: rgba(255,255,255,0.15); }
[data-theme="dark"] .perm-cell-admin.granted { background: #d97706; border-color: #d97706; }
[data-theme="dark"] .perm-cell.pending::after,
[data-theme="dark"] .perm-cell-admin.pending::after { border-color: var(--bg-card); }
[data-theme="dark"] .badge-stimme-s { background: rgba(167,139,250,0.15); color: #a78bfa; }
[data-theme="dark"] .badge-stimme-a { background: rgba(193,68,104,0.20);  color: #f0809a; }
[data-theme="dark"] .badge-stimme-t { background: rgba(56,189,248,0.15);  color: #38bdf8; }
[data-theme="dark"] .badge-stimme-b { background: rgba(52,211,153,0.15);  color: #34d399; }
[data-theme="dark"] .badge-stimme-c { background: rgba(251,191,36,0.15);  color: #fbbf24; }
[data-theme="dark"] .badge-stimme-m { background: rgba(34,211,238,0.15);  color: #22d3ee; }

/* Apply bar */
.perm-apply-bar {
    position: fixed;
    bottom: 0;
    left: var(--sb-width);
    right: 0;
    padding: 14px 28px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    transform: translateY(100%);
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
}
.perm-apply-bar.visible { transform: translateY(0); }
.perm-change-summary { font-size: 13px; color: var(--t3); }
[data-theme="dark"] .perm-apply-bar { box-shadow: 0 -2px 12px rgba(0,0,0,0.35); }

.perm-matrix-wrap             { --border-strong: rgba(0,0,0,0.55); }
[data-theme="dark"] .perm-matrix-wrap { --border-strong: rgba(255,255,255,0.4); }
[data-theme="dark"] .perm-user-col {
    background: linear-gradient(var(--stimme-tint, transparent), var(--stimme-tint, transparent)), var(--bg-card);
}
[data-theme="dark"] .perm-corner,
[data-theme="dark"] .perm-col-head { background: var(--bg-thead); }

@media (max-width: 768px) {
    .perm-apply-bar { left: 0; }
    .perm-user-col { min-width: 0; }
    .perm-user-name { padding: 8px; }
    .perm-user-info { gap: 0; }
    .perm-user-info .badge { display: none; }
}
    </style>
    <div class="table-view">
        <div class="perm-matrix-wrap">
            <table class="perm-matrix">
                <thead>
                    <tr>
                        <th class="perm-user-col perm-corner"></th>
                        {% for group in groups %}
                            <th class="perm-col-head" data-group="{{ group.name }}">
                                <div class="perm-col-rotate">
                                    <span>{{ group.name }}</span>
                                </div>
                            </th>
                        {% endfor %}
                        <th class="perm-col-head perm-col-admin" data-admin="true">
                            <div class="perm-col-rotate">
                                <span>Admin</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="perm-tbody">
                    {% include "berechtigungen_rows.html" %}
                </tbody>
            </table>
            {% if has_more %}
            <div id="perm-sentinel" class="table-sentinel" data-next-offset="{{ next_offset }}"></div>
            {% endif %}
        </div>
    </div>
    <div class="perm-apply-bar" id="perm-apply-bar">
        <span class="perm-change-summary" id="perm-change-summary"></span>
        <button type="button" class="btn btn-primary" id="perm-apply-btn">
            Änderungen anwenden (<span id="perm-change-count">0</span>)
        </button>
    </div>
    {{ matrix|json_script:"matrix-data" }}
    <script>
(function () {
    'use strict';

    const matrixData = JSON.parse(document.getElementById('matrix-data').textContent);
    const changes = new Map();

    const CHECKMARK = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>';
    const CHECKMARK_GOLD = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>';

    function isGroupGranted(userId, groupName) {
        const data = matrixData[String(userId)];
        return data ? data.groups.includes(groupName) : false;
    }
    function isAdminGranted(userId) {
        const data = matrixData[String(userId)];
        return data ? data.is_superuser : false;
    }

    function bindCells(root) {
        root.querySelectorAll('.perm-cell[data-type="group"]').forEach(function (btn) {
            const userId = btn.dataset.user;
            const group = btn.dataset.group;
            if (isGroupGranted(userId, group)) {
                btn.classList.add('granted');
                btn.innerHTML = CHECKMARK;
            }
            btn.addEventListener('click', function () { toggleGroupCell(btn); });
        });
        root.querySelectorAll('.perm-cell-admin[data-type="admin"]').forEach(function (btn) {
            const userId = btn.dataset.user;
            if (isAdminGranted(userId)) {
                btn.classList.add('granted');
                btn.innerHTML = CHECKMARK_GOLD;
            }
            btn.addEventListener('click', function () { toggleAdminCell(btn); });
        });
    }

    bindCells(document);

    function toggleGroupCell(btn) {
        const userId = btn.dataset.user;
        const group = btn.dataset.group;
        const key = userId + ':group:' + group;
        const newGranted = !btn.classList.contains('granted');
        const originalGranted = isGroupGranted(userId, group);

        btn.classList.toggle('granted', newGranted);
        btn.innerHTML = newGranted ? CHECKMARK : '';

        if (newGranted !== originalGranted) {
            changes.set(key, { type: 'group', user_id: parseInt(userId, 10), group: group, granted: newGranted });
            btn.classList.add('pending');
        } else {
            changes.delete(key);
            btn.classList.remove('pending');
        }
        updateApplyBar();
    }

    function toggleAdminCell(btn) {
        const userId = btn.dataset.user;
        const key = userId + ':admin';
        const newGranted = !btn.classList.contains('granted');
        const originalGranted = isAdminGranted(userId);

        btn.classList.toggle('granted', newGranted);
        btn.innerHTML = newGranted ? CHECKMARK_GOLD : '';

        if (newGranted !== originalGranted) {
            changes.set(key, { type: 'admin', user_id: parseInt(userId, 10), granted: newGranted });
            btn.classList.add('pending');
        } else {
            changes.delete(key);
            btn.classList.remove('pending');
        }
        updateApplyBar();
    }

    function updateApplyBar() {
        const count = changes.size;
        document.getElementById('perm-change-count').textContent = count;
        const bar = document.getElementById('perm-apply-bar');
        bar.classList.toggle('visible', count > 0);
        const summary = document.getElementById('perm-change-summary');
        summary.textContent = count === 1 ? '1 ungespeicherte Änderung'
                            : count > 1   ? count + ' ungespeicherte Änderungen'
                            : '';
    }

    function rowStimme(row) {
        const td = row.querySelector('.perm-user-col');
        if (!td) return '';
        const m = td.className.match(/perm-stimme-(\w)/);
        return m ? m[1] : '';
    }
    function markVoiceGroupLastRows() {
        const rows = Array.from(document.querySelectorAll('.perm-row'));
        rows.forEach(function (row, i) {
            const next = rows[i + 1];
            row.classList.toggle(
                'perm-row-group-last',
                Boolean(next) && rowStimme(row) !== rowStimme(next)
            );
        });
    }
    markVoiceGroupLastRows();

    function getCsrfToken() {
        const match = document.cookie.match(/csrftoken=([^;]+)/);
        return match ? match[1] : '';
    }

    const applyBtn = document.getElementById('perm-apply-btn');
    const changeCountEl = document.getElementById('perm-change-count');

    (function setupInfiniteScroll() {
        const sentinel = document.getElementById('perm-sentinel');
        if (!sentinel) return;
        const container = document.querySelector('.perm-matrix-wrap');
        const tbody = document.getElementById('perm-tbody');
        if (!container || !tbody) return;
        let loading = false, done = false;
        function buildUrl(offset) {
            const p = new URLSearchParams(window.location.search);
            p.set('offset', offset);
            return window.location.pathname + '?' + p.toString();
        }
        function loadMore() {
            if (loading || done) return;
            const offset = parseInt(sentinel.dataset.nextOffset, 10);
            loading = true;
            sentinel.classList.add('loading');
            fetch(buildUrl(offset), { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    Object.assign(matrixData, data.matrix || {});
                    const temp = document.createElement('tbody');
                    temp.innerHTML = data.html;
                    const newRows = Array.from(temp.children);
                    newRows.forEach(function (row) { tbody.appendChild(row); });
                    newRows.forEach(bindCells);
                    markVoiceGroupLastRows();
                    if (data.has_more) {
                        sentinel.dataset.nextOffset = data.next_offset;
                    } else {
                        done = true;
                        observer.disconnect();
                        sentinel.remove();
                    }
                })
                .catch(function (e) { console.error('Berechtigungen scroll error:', e); })
                .finally(function () {
                    loading = false;
                    if (!done) sentinel.classList.remove('loading');
                });
        }
        const observer = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) loadMore();
        }, { root: container, rootMargin: '200px' });
        observer.observe(sentinel);
    })();

    applyBtn.addEventListener('click', async function () {
        applyBtn.disabled = true;
        const savedLabel = changeCountEl.textContent;
        changeCountEl.textContent = '…';

        const payload = { changes: Array.from(changes.values()) };
        try {
            const resp = await fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                },
                body: JSON.stringify(payload),
            });
            if (resp.ok) {
                location.reload();
            } else {
                applyBtn.disabled = false;
                changeCountEl.textContent = savedLabel;
            }
        } catch (e) {
            applyBtn.disabled = false;
            changeCountEl.textContent = savedLabel;
        }
    });
})();
    </script>
{% endblock %}
