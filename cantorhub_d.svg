<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="CantorHub">
  <title>CantorHub — Notensystem</title>
  <desc>Stimmgabel vor einem Notensystem, dessen Linien hinter ihr durchlaufen.</desc>

  <!-- Farben stehen als Attribute am Element; das CSS unten hellt sie nur fuer
       den Dark Mode auf. Renderer ohne CSS-Unterstuetzung bleiben so korrekt. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .hell   { stop-color: #ec8aa9; }
      .dunkel { stop-color: #c14468; }
      .linie  { stroke: #e0688a; }
    }
  </style>

  <defs>
    <linearGradient id="chd-gabel" x1="64" y1="28" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="hell"   stop-color="#d4587b"/>
      <stop offset="1" class="dunkel" stop-color="#a83a5a"/>
    </linearGradient>

    <!-- Die Linien werden im Umriss der Gabel ausgespart, damit sie nicht
         durch sie hindurchlaufen und die Form nicht antasten. Der gefuellte
         Pfad schliesst dabei den Innenraum zwischen den Zinken. -->
    <mask id="chd-freistellen">
      <rect x="0" y="0" width="128" height="128" fill="#fff"/>
      <path d="M52 32 L52 68 A12 12 0 0 0 76 68 L76 32 Z" fill="#000"/>
      <g fill="none" stroke="#000" stroke-width="15" stroke-linecap="round">
        <path d="M52 32 L52 68 A12 12 0 0 0 76 68 L76 32"/>
        <path d="M64 80 L64 96"/>
      </g>
    </mask>
  </defs>

  <g class="linie" mask="url(#chd-freistellen)" fill="none" stroke="#c14468"
     stroke-width="3.5" stroke-linecap="round" opacity="0.5">
    <path d="M10 44 H118"/>
    <path d="M10 54 H118"/>
    <path d="M10 64 H118"/>
    <path d="M10 74 H118"/>
    <path d="M10 84 H118"/>
  </g>

  <!-- Stimmgabel -->
  <g fill="none" stroke="url(#chd-gabel)" stroke-width="8" stroke-linecap="round">
    <path d="M52 32 L52 68 A12 12 0 0 0 76 68 L76 32"/>
    <path d="M64 80 L64 96"/>
  </g>
</svg>
